name: Deploy PassionWaves Media

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1

    steps:

      # ----------------------------------------
      # Step 1: Checkout repository
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Debug Role ARN
        run: |
          echo "${{ secrets.AWS_ROLE_ARN }}" | sed 's/.*role\///'

      # ----------------------------------------
      # Step 2: Debug GitHub identity context
      # ----------------------------------------
      - name: Debug GitHub Context
        run: |
          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Branch:"
          echo "${{ github.ref }}"

          echo ""
          echo "Workflow:"
          echo "${{ github.workflow }}"

          echo ""
          echo "Actor:"
          echo "${{ github.actor }}"

      # ----------------------------------------
      # Step 3: Verify OIDC token availability
      # ----------------------------------------
      - name: Debug OIDC Token
        run: |
          echo "Checking OIDC token availability..."

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "OIDC URL is missing"
            exit 1
          else
            echo "OIDC URL exists"
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" ]; then
            echo "OIDC request token is missing"
            exit 1
          else
            echo "OIDC request token exists"
          fi

      # ----------------------------------------
      # Step 4: Configure AWS credentials using OIDC
      # ----------------------------------------
      - name: Inspect OIDC Claims
        run: |
          TOKEN=$(curl \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
      
          python3 - <<EOF
            import base64
            import json
            
            token = "$TOKEN"
            
            payload = token.split('.')[1]
            payload += "=" * (-len(payload) % 4)
            
            claims = json.loads(base64.urlsafe_b64decode(payload))
            
            print("Issuer:")
            print(claims.get("iss"))
            
            print("")
            print("Audience:")
            print(claims.get("aud"))
            
            print("")
            print("Subject:")
            print(claims.get("sub"))
            
            print("")
            print("Repository:")
            print(claims.get("repository"))
            
            print("")
            print("Ref:")
            print(claims.get("ref"))
          EOF

      # ----------------------------------------
      # Step 5: Confirm AWS identity
      # ----------------------------------------
      - name: Verify AWS Identity
        run: |
          echo "Checking AWS caller identity..."
          aws sts get-caller-identity

      # ----------------------------------------
      # Step 6: Validate S3 access
      # ----------------------------------------
      - name: Test S3 Permissions
        run: |
          echo "Testing S3 access..."

          aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }}

      # ----------------------------------------
      # Step 7: Build website
      # ----------------------------------------
      - name: Build site
        run: |
          python3 build.py

      # ----------------------------------------
      # Step 8: Deploy to S3
      # ----------------------------------------
      - name: Deploy to S3
        run: |
          aws s3 sync ./public \
          s3://${{ secrets.S3_BUCKET_NAME }} \
          --delete

      # ----------------------------------------
      # Step 9: CloudFront invalidation
      # ----------------------------------------
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
